name: irradiance-integrator-patch

on:
  push:
    branches:
      - oracle/irradiance-reference-2026-09-04
    paths:
      - oracle/apply_irradiance_integrator.py
      - .github/workflows/irradiance-integrator-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: irradiance-integrator-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Checkout pregenerated RGB-to-spectrum tables
        uses: actions/checkout@v5
        with:
          repository: mmp/rgb2spectrum
          path: build

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenexr-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev \
            libwayland-bin libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-0

      - name: Apply guarded source patch
        run: python3 oracle/apply_irradiance_integrator.py

      - name: Configure CPU release build
        run: |
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPBRT_USE_PREGENERATED_RGB_TO_SPECTRUM_TABLES=True

      - name: Build renderer and tests
        run: cmake --build build --parallel 3 --target pbrt_exe imgtool pbrt_test

      - name: Irradiance parser and renderer smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p irradiance-smoke
          cat > irradiance-smoke/constant-env.pbrt <<'PBRT'
          LookAt 0 0 4  0 0 0  0 1 0
          Camera "perspective" "float fov" [24]
          Film "rgb" "integer xresolution" [16] "integer yresolution" [16]
               "string filename" ["constant-env.exr"] "bool savefp16" [false]
          Sampler "halton" "integer pixelsamples" [64] "integer seed" [41]
          Integrator "irradiance" "integer maxdepth" [4] "string component" ["total"]
          WorldBegin
          LightSource "infinite" "rgb L" [1 1 1]
          Material "diffuse" "rgb reflectance" [.5 .5 .5]
          Shape "sphere" "float radius" [1]
          PBRT
          cd irradiance-smoke
          ../build/pbrt --quiet constant-env.pbrt
          test -s constant-env.exr
          ../build/imgtool convert constant-env.exr --outfile constant-env.pfm
          test -s constant-env.pfm

      - name: Commit qualified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oracle-reference-bot"
          git config user.email "oracle-reference-bot@users.noreply.github.com"
          git add src/pbrt/cpu/integrators.h src/pbrt/cpu/integrators.cpp
          git diff --cached --check
          git commit -m "oracle: implement camera-conditioned irradiance integrator"
          git push origin HEAD:oracle/irradiance-reference-2026-09-04
