name: reference-render-canaries

on:
  push:
    branches:
      - oracle/reference-hardening-2026-09-04
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-render-canaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport-canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Checkout pregenerated RGB-to-spectrum tables
        uses: actions/checkout@v5
        with:
          repository: mmp/rgb2spectrum
          path: build

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenexr-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev \
            libwayland-bin libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-0

      - name: Configure CPU reference build
        shell: bash
        run: |
          set -euo pipefail
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPBRT_USE_PREGENERATED_RGB_TO_SPECTRUM_TABLES=True

      - name: Build renderer and image measurement tool
        run: cmake --build build --parallel 3 --target pbrt_exe imgtool

      - name: Run analytic rendered-transport canaries
        shell: bash
        run: |
          set -euo pipefail
          python3 oracle/render_canaries.py \
            --pbrt build/pbrt \
            --imgtool build/imgtool \
            --out reference-canaries \
            --commit "$GITHUB_SHA"

      - name: Seal canary provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'schema=2'
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo 'qualification_surface=GI_ORACLE_RENDER_CANARIES'
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
            echo "compiler=$(c++ --version | head -1 || true)"
            echo "cmake=$(cmake --version | head -1 || true)"
            echo 'submodules_begin'
            git submodule status --recursive
            echo 'submodules_end'
            echo 'binaries_begin'
            sha256sum build/pbrt build/imgtool
            echo 'binaries_end'
            echo 'oracle_sources_begin'
            sha256sum oracle/render_canaries.py oracle/REFERENCE_RELEASE.md .github/workflows/reference-render-canaries.yml
            echo 'oracle_sources_end'
          } > reference-canaries/provenance.txt

      - name: Upload transport canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-render-canaries-${{ github.sha }}
          path: reference-canaries/
          if-no-files-found: error
          retention-days: 14
